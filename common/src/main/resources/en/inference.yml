# Enable the AI server?
enabled: true

inference:
  endpoint:
    base-url: 'https://api.react-ac.space'

auth:
  enabled: true
  # Token of your server from https://www.react-ac.space/
  value: YOUR_TOKEN
  # Do not change when using our model: none / bearer / header / query / body
  type: body

client:
  connect-timeout: 10s
  read-timeout: 10s
  write-timeout: 10s
  call-timeout: 10s
  retry-on-failure: true
