#
# React - AI-Powered Anti-Cheat
#
# Plugin source code: https://github.com/g4vrk/React
# (The AI model is not included in this project)
#
# Purchase access to our model -> https://www.react-ac.space/
#

# Enable the AI server?
enabled: true

# FLOWER: JSON protocol, buffer settings live in checks/aim-ai.yml.
# UNIVERSE: binary protocol, settings are in the "universe" section below.
model: FLOWER

universe:
  # Frames per request and how often a request is sent (in frames).
  sequence: 64
  step: 32
  # Combat window in ticks, independent of FLOWER's combat time.
  combat-ticks: 64

inference:
  endpoint:
    base-url: 'https://api.react-ac.space'
    path: '/api/v2/inference/'

auth:
  enabled: true
  # Token of your server from https://www.react-ac.space/
  value: YOUR_TOKEN
  # Do not change when using our model: none / bearer / header / query / body
  type: body

client:
  connect-timeout: 10s
  read-timeout: 10s
  write-timeout: 10s
  call-timeout: 10s
  retry-on-failure: true
