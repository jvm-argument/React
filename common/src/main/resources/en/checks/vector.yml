# Frame buffer settings
buffer:

  # Frames sent in one request.
  # If you use our model, keep 64.
  sequence: 64

  # How often a request is sent, in frames.
  # If you use our model, keep 32.
  step: 32

# Combat window in ticks during which frames are collected.
combat-ticks: 64
