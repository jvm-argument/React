# Настройки буфера
buffer:

  # Сколько кадров отправлять в одном запросе?
  # Если используете нашу модель, оставляйте 64
  sequence: 64

  # С каким шагом отправлять запросы (в кадрах)?
  # Если используете нашу модель, оставляйте 32
  step: 32

# Окно боя в тиках, в течение которого собираются кадры
combat-ticks: 64

# С какого процента читерства игрок считается нарушителем
alert:
  threshold: 0.90

# На сколько уменьшать VL, если игрок не читерит (После указанного количества поворотов)
decay:
  amount: 0.50
