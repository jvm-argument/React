#
# React - АнтиЧит основанный на Проверках от Нейросети
#
# Исходный код плагина: https://github.com/g4vrk/React
# (ИИ модель не входит в проект)
#
# Купить доступ к нашей модели -> https://www.react-ac.space/
#

# Включить ИИ сервер?
enabled: true

# FLOWER: JSON протокол, настройки буфера в checks/aim-ai.yml.
# UNIVERSE: бинарный протокол, настройки в секции "universe" ниже.
model: FLOWER

universe:
  # Кадров в запросе и как часто отправлять запрос (в кадрах).
  sequence: 64
  step: 32
  # Окно боя в тиках, независимо от времени боя FLOWER.
  combat-ticks: 64

inference:
  endpoint:
    base-url: 'https://api.react-ac.space'
    path: '/api/v2/inference/'

auth:
  enabled: true
  # Токен вашего сервера с https://www.react-ac.space/
  value: ВСТАВЬТЕ_ВАШ_КЛЮЧ
  # Для нашей модели не изменяйте: none / bearer / header / query / body
  type: body

client:
  connect-timeout: 10s
  read-timeout: 10s
  write-timeout: 10s
  call-timeout: 10s
  retry-on-failure: true
